name: GDScript

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdtoolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install "gdtoolkit==4.5.*"
      - name: gdlint and gdformat, skipping vendored addons
        run: |
          mapfile -t files < <(find src -name '*.gd' -not -path 'src/addons/*' -not -path 'src/.godot/*' 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No GDScript files outside src/addons/ yet; nothing to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gdlint "${files[@]}"
          gdformat --check "${files[@]}"
