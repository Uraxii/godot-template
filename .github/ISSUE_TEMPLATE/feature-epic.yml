name: Feature epic
description: A player-facing feature that groups UI, mechanics, art, audio, and QA work.
title: "[Epic] "
labels: [epic]
body:
  - type: textarea
    id: goal
    attributes:
      label: Player-facing goal
      description: What the player can do or feel when this ships.
    validations:
      required: true
  - type: textarea
    id: pillars
    attributes:
      label: Design pillars supported
      description: Which pillars this feature serves, and how.
    validations:
      required: true
  - type: textarea
    id: prototype-result
    attributes:
      label: Prototype result
      description: The build, change, or drop decision from each prototype, with a link to its issue. Leave blank if there was no prototype.
      placeholder: "Build it. See #124: double jump tested well with a controller."
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable checks a playtester can see or run.
      placeholder: |
        - A player can ___ and sees ___
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this epic will not do, to stop it growing.
