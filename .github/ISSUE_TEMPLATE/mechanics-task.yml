name: Mechanics task
description: Gameplay rules or systems work for an epic.
title: "[Mechanics] "
labels: [mechanics]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: Epic issue number, for sub-issue linking.
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Rules and behavior
      description: How the mechanic works.
    validations:
      required: true
  - type: textarea
    id: tuning
    attributes:
      label: Tuning values
      description: Each value designers will tweak, with its starting value and intended feel.
      placeholder: "Jump height 3.2: clears a two-tile gap with no running start"
  - type: textarea
    id: edge
    attributes:
      label: Edge cases
      description: Odd inputs, timing, or states to handle.
  - type: textarea
    id: try-it
    attributes:
      label: Try it
      description: Steps and what you should see at each one, for every variant the mechanic touches (difficulty, input, character).
      placeholder: |
        1. Do ___ → see ___
        2. Do ___ → see ___
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable checks a playtester can see or run.
      placeholder: |
        - A player can ___ and sees ___
    validations:
      required: true
