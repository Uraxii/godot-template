name: Mechanics task
description: Rules, systems, or core behavior work for an epic.
title: "[Mechanics] "
labels: [mechanics]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: Epic issue number, for sub-issue linking.
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Rules and behavior
      description: How the rules or core behavior work.
    validations:
      required: true
  - type: textarea
    id: tuning
    attributes:
      label: Tuning values
      description: Each value someone will tune, with its starting value and intended feel.
      placeholder: "Retry limit 3: a failed sync gives up after three tries"
  - type: textarea
    id: edge
    attributes:
      label: Edge cases
      description: Odd inputs, timing, or states to handle.
  - type: textarea
    id: try-it
    attributes:
      label: Try it
      description: Steps and what you should see at each one, for every variant this touches (mode, input, role).
      placeholder: |
        1. Do ___ → see ___
        2. Do ___ → see ___
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable checks a reviewer can see or run.
      placeholder: |
        - A user can ___ and sees ___
    validations:
      required: true
