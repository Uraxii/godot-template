name: Bug report
description: Something in the game is broken.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build or version
    validations:
      required: true
  - type: input
    id: godot-version
    attributes:
      label: Godot version
      description: The engine version the build uses, from Help > About in the editor.
      placeholder: "4.7.2"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Windows, Linux, Web, Android..."
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - Major
        - Minor
        - Trivial
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Screenshots, video, logs, or save files. Drag files here.
