name: Art asset
description: A visual asset needed for an epic.
title: "[Art] "
labels: [art]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: Epic issue number, for sub-issue linking.
      placeholder: "#123"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Asset type
      options:
        - Image or illustration
        - Icon
        - 3D model
        - Texture
        - Animation
        - Visual effect
        - Other
    validations:
      required: true
  - type: textarea
    id: style
    attributes:
      label: Style references
      description: Links or images showing the target look.
  - type: textarea
    id: specs
    attributes:
      label: Specs
      description: Size, resolution, format.
      placeholder: |
        Size:
        Resolution:
        Format:
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where it appears
      description: Where the user sees this asset.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable checks a reviewer can see or run.
      placeholder: |
        - Shows in the product at ___ with no stretching or seams
    validations:
      required: true
